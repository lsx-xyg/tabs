<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 300px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; }
input, select, button { width: 100%; margin: 4px 0; padding: 8px; box-sizing: border-box; }
button { background: #18181b; color: white; border: none; border-radius: 6px; cursor: pointer; }
button:disabled { opacity: 0.5; }
#status { font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
<h3 style="margin:0 0 8px">收藏到 Tabs</h3>
<input id="title" placeholder="标题" />
<input id="url" placeholder="URL" />
<select id="category"><option value="">默认分类</option></select>
<button id="save">保存</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
